    content: 📢 欢迎您来～
  card_recent_posts:
    enable: true # 最新文章
  card_categories:
    enable: true # 分类
  card_tags:
    enable: false
  card_archives:
    enable: true # 归档
  card_webinfo:
    enable: true # 网站信息
    
# 侧边栏个人头像
avatar:
  img: /images/avatar.jpg
  
# 网站底部配置
