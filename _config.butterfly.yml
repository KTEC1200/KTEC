# 整体布局色彩 light浅色、dark深色、auto自动
display_mode: light

# 网站全局主题色配置
theme_color:
  enable: true
  main: "#1E90FF"           # 核心主色调：闪避蓝 (DodgerBlue)，用于主要按钮与核心边框
  paginator: "#00BFFF"      # 翻页与悬浮色：深天空蓝 (DeepSkyBlue)，比主色略亮，增加层次
  button_hover: "#0073E6"   # 按钮悬浮反馈色：较深的海洋蓝，提供清晰的点击暗示
  text_selection: "#00BFFF" # 鼠标选中文字时的背景色
  link_color: "#1E90FF"     # 正文内超链接的默认颜色
  hr_color: "#87CEFA"       # 分割线颜色：淡蓝色 (LightSkyBlue)，避免视觉生硬

# 网站全局背景设置，直接填写相对路径，不要加 url()
background: /images/001.jpg

# 首页顶部图 (设置为 false 彻底关闭占位，让页面更加紧凑极简)
index_img: false

# 顶部导航栏设置
nav:
  enable: true
  # 开启向下滚动时的悬浮固定效果
  fixed: true
  # 开启全局透明效果，滚动时将自动调用底层的 CSS 毛玻璃滤镜 (backdrop-filter)
  transparent: true

# 全站无刷新加载 (PJAX)
pjax:
  enable: true
  exclude:
    # 暂无需要排除的特殊页面，保持为空或默认即可

# 本地搜索  
local_search:
  enable: true
  preload: false
  
# Inject
# 插入代码到头部 </head> 之前 和 底部 </body> 之前
inject:
  head:
    # 1. 引入毛玻璃效果
    - <link rel="stylesheet" href="/css/transparent.css">
    # 2. 引入自定义字体
    - <link rel="stylesheet" href="/css/font.css">
    # 3. 引入页脚动态渐变
    - <link rel="stylesheet" href="/css/footer.css">
    # 如果你之前的 custom.css 还在，可以保留或合并，看个人习惯
    # - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/welcome.js"></script>
    # 可以引入多个 JS 文件
    # - <script src="/js/another.js"></script>
    
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart
  
aside:
  enable: true
  position: right 
  card_author:
    enable: true                # 是否开启作者卡片
    description: 无法选中        # 个人简介
    button:                     # 卡片底部的按钮
      icon: fas fa-home         # 按钮图标
      text: Myself              # 按钮文字
      link: https://github.com/KTEC1200    
  card_announcement:
    enable: true # 公告
    content: 📢 欢迎您来～
  card_recent_posts:
    enable: true # 最新文章
  card_categories:
    enable: true # 分类
  card_tags:
    enable: true # 标签
  card_archives:
    enable: true # 归档
  card_webinfo:
    enable: true # 网站信息
    
avatar:
  img: /images/002.jpg
  
# 正确的 footer 配置
footer:
  owner:
    enable: true
    since: 2024
  copyright: true
  custom_text: 
  theme:
    enable: false          # 注意：这是两个空格缩进
  framework:
    enable: false          # 同样两个空格