# 整体布局色彩 light浅色、dark深色、auto自动
display_mode: light

# 深色模式：启用原生暗色 CSS（供 [data-theme='dark'] 生效），切换由 theme-toggle.js 负责
darkmode:
  enable: true
  button: false
  autoChangeMode: false

# 网站全局主题色配置
theme_color:
  enable: true
  main: "#ff5277"           # 核心主色调：珊瑚粉 (Klise)
  paginator: "#ff5277"      # 翻页与悬浮色：珊瑚粉
  button_hover: "#e03e63"   # 按钮悬浮反馈色：较深珊瑚粉
  text_selection: "#ff5277" # 鼠标选中文字时的背景色
  link_color: "#ff5277"     # 正文内超链接的默认颜色
  hr_color: "#ffb3c1"       # 分割线颜色：浅粉

# 网站全局背景设置，直接填写相对路径，不要加 url()！！！
background: /images/background.jpg

# 关闭所有页面顶部大图（去掉横幅，标题落入卡片，同 Klise）
disable_top_img: true

# 首页顶部图 (设置为 false 彻底关闭占位，让页面更加紧凑极简)
index_img: false

# 网站图标
favicon: /images/favicon.png

# 顶部导航栏设置
nav:
  enable: true
  # 开启向下滚动时的悬浮固定效果
  fixed: true
  # 开启全局透明效果，滚动时将自动调用底层的 CSS 毛玻璃滤镜 (backdrop-filter)
  transparent: true

# 全站无刷新加载 (PJAX)
pjax:
  enable: true
  exclude:
    # 暂无需要排除的特殊页面，保持为空或默认即可

# 本地搜索  
local_search:
  enable: true
  preload: false
  
# 引入 css 和 js 效果
inject:
  head:
    # 0. 深色模式防闪烁（首屏即按 localStorage/系统偏好设置 data-theme）
    - "<script>(function(){try{var m=JSON.parse(localStorage.getItem('theme')||'{\"value\":\"auto\"}').value;var d=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>"
    # 1. 引入 Klise 毛玻璃 + 配色
    - <link rel="stylesheet" href="/css/klise-glass.css">
    # 2. 引入自定义字体
    - <link rel="stylesheet" href="/css/font.css">
    
    - <link rel="stylesheet" href="/css/comments.css">

  bottom:
    - <script src="/js/theme-toggle.js"></script>
    # 可以引入多个 JS 文件
    # - <script src="/js/another.js"></script>
    
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-tasks
  留言板: /messageboard/ || fas fa-envelope
  分类: /categories/ || fas fa-folder-open
  资源盘: https://ktec0230.dpdns.org/ || fas fa-cloud || _blank
  友链: /link/ || fas fa-link
  关于: /about/ || fas fa-paper-plane
  
