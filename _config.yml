# Site
# 网站主标题
title: 红尘
# 网站副标题
subtitle: ''
# 网站描述，常用于SEO，会出现在搜索引擎结果中
description: 'いつかあなたの大切な人と再会できますように'
# 网站关键词
keywords:
# 网站作者
author: KTEC
# 网站语言
language: zh-CN
# 网站时区
timezone: 'Asia/Shanghai'

# URL
# 网站最终的访问地址（最后全弄好了之后再改）
url: https://ktec0230.netlify.app/
# 文章的永久链接格式
permalink: :year/:month/:title/
permalink_defaults:
# 美化URL，删除 index.html 或 .html 后缀
pretty_urls:
  trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
# 存放文章、页面等源文件
source_dir: source
# 生成静态网站文件的输出目录
public_dir: public
# 标签页面的路径
tag_dir: tags
# 归档页面的路径
archive_dir: archives
# 分类页面的路径
category_dir: categories
# 存放代码文件的目录
code_dir: downloads/code
i18n_dir: :lang
# 跳过渲染，直接复制到 public 目录的文件
skip_render:
  - admin/**

# Writing
# Markdown 文件的命名格式
new_post_name: :title.md 
# 新建文章时的默认布局
default_layout: post
# 是否将标题自动转换为首字母大写格式
titlecase: false 
# 控制外部链接是否在新标签页中打开
external_link:
  enable: true 
  field: site 
  exclude: ''
filename_case: 0
render_drafts: false
# 为每篇文章创建一个同名的资源文件夹
post_asset_folder: false
# 是否使用相对路径
relative_link: false
# 是否显示发布日期为未来的文章
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
# 文章未指定分类时的默认分类
default_category: default
# 将分类名映射到更友好的 URL
category_map:
# 将标签名映射到更友好的 URL
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
# 日期显示格式
date_format: YYYY-MM-DD
# 时间显示格式
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
# 每页显示的文章数量
per_page: 5
# 分页页面的URL目录
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
# 网站使用的主题
theme: butterfly

# Deployment
# 一键部署的配置
deploy:
  type: ''

#本地搜索
search:
  path: search.xml
  field: post
  content: true
  format: html